name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r plugins/seichi-junrei/requirements.txt
      - name: Test shared skill and package
        working-directory: plugins/seichi-junrei
        run: python -m unittest discover -s tests -v
      - name: Render and lint example
        working-directory: plugins/seichi-junrei
        run: |
          python scripts/render_guide.py examples/egypt_guide.json --out /tmp/seichi-demo.html
          python scripts/lint_guide.py /tmp/seichi-demo.html --guide examples/egypt_guide.json
      - name: Test plugin in isolation
        run: |
          cp -R plugins/seichi-junrei /tmp/seichi-junrei-isolated
          cd /tmp/seichi-junrei-isolated
          python -m unittest discover -s tests -v
          python scripts/render_guide.py examples/egypt_guide.json --out /tmp/seichi-isolated-demo.html
          python scripts/lint_guide.py /tmp/seichi-isolated-demo.html --guide examples/egypt_guide.json

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser and dependencies
        run: |
          python -m pip install -r plugins/seichi-junrei/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Verify mobile layout and checklist persistence
        run: python plugins/seichi-junrei/tests/browser_check.py --outdir /tmp/seichi-browser-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-screenshots
          path: /tmp/seichi-browser-checks
