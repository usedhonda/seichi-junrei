name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: |
          python scripts/render_guide.py examples/egypt_guide.json --out /tmp/sample-guide.html
          python scripts/lint_guide.py /tmp/sample-guide.html --guide examples/egypt_guide.json
